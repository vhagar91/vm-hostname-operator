#@ load("@ytt:data", "data")
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hostname-operator
  namespace: #@ data.values.namespace
  labels:
    app.kubernetes.io/name: hostname-operator
    app.kubernetes.io/component: controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hostname-operator-manager
  labels:
    app.kubernetes.io/name: hostname-operator
    app.kubernetes.io/component: controller
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["vmoperator.vmware.com"]
    resources: ["virtualmachines"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["vmoperator.vmware.com"]
    resources: ["virtualmachines/status"]
    verbs: ["get"]
  - apiGroups: ["hostname.vcf.vmware.com"]
    resources: ["hostnamecounters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["hostname.vcf.vmware.com"]
    resources: ["hostnamecounters/finalizers"]
    verbs: ["update"]
  - apiGroups: ["hostname.vcf.vmware.com"]
    resources: ["hostnamecounters/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hostname-operator-manager
  labels:
    app.kubernetes.io/name: hostname-operator
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hostname-operator-manager
subjects:
  - kind: ServiceAccount
    name: hostname-operator
    namespace: #@ data.values.namespace