---
apiVersion: data.packaging.carvel.dev/v1alpha1
kind: PackageMetadata
metadata:
  name: hostname-operator.vcf.vmware.com
  labels:
    services.vcfa.broadcom.com/can-auto-scale-regions: "false"
    services.vcfa.broadcom.com/can-auto-scale-supervisors: "true"
spec:
  displayName: VM Hostname Operator
  shortDescription: Automates VM hostname generation from templates with vCenter duplicate validation
  longDescription: |
    The VM Hostname Operator provides automated hostname generation for
    VirtualMachine resources in VCF Automation. It supports configurable
    hostname templates (e.g., "machinename###"), incremental counters,
    and validates uniqueness against vCenter before VM creation.
  providerName: VCF Services
  maintainers:
    - name: VCF Services Team

---
apiVersion: packaging.carvel.dev/v1alpha1
kind: Package
metadata:
  name: hostname-operator.vcf.vmware.com
spec:
  refName: hostname-operator.vcf.vmware.com
  version: 1.0.0
  releasedAt: 2026-05-14T00:00:00Z
  capacityRequirementsDescription: |
    The hostname operator requires a small amount of resources for its
    mutating webhook and controller.
  releaseNotes: |
    Initial release of the VM Hostname Operator.
    - Configurable hostname template with incremental counters
    - vCenter duplicate hostname validation
    - Annotation-based per-VM template override support
  valuesSchema:
    openAPIv3:
      title: hostname-operator.vcf.vmware.com values schema
      properties:
        regions:
          type: array
          description: Collection of regional configurations.
          items:
            type: object
            required:
              - name
              - hostSupervisor
            properties:
              name:
                type: string
                description: Region name.
              hostSupervisor:
                type: object
                description: Host Supervisor configuration for this region.
                required:
                  - name
                properties:
                  name:
                    type: string
                    description: Supervisor cluster name.
                  configuration:
                    type: object
                    description: Operator configuration for this Supervisor.
                    properties:
                      logLevel:
                        type: string
                        default: info
                        description: Log level for the operator (debug, info, error).
                      vcenterValidation:
                        type: boolean
                        default: true
                        description: Enable vCenter hostname duplicate validation.
                      defaultTemplate:
                        type: string
                        default: "vm-###"
                        description: Default hostname template if not specified via annotation.
                      counterStart:
                        type: integer
                        default: 1
                        description: Starting index for hostname counters.
              clientSupervisors:
                type: array
                description: Client supervisor cluster names in this region.
                items:
                  type: string
  template:
    spec:
      fetch:
        - imgpkgBundle:
            image: ""
      template:
        - ytt:
            paths:
              - config/
            ignoreUnknownComments: true
        - kbld:
            paths:
              - "-"
              - .imgpkg/images.yml
      deploy:
        - kapp: {}